<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melhor Fantasia 🎃</title><meta property="og:title" content="Melhor Fantasia 🎃 Halloween Grupo Shrigma"><meta property="og:description" content="Vote na melhor fantasia da festa!"><style>
:root{--bg:#120a1f;--card:#1e1233;--card2:#27183f;--text:#f6eefc;--muted:#b9a7d1;--accent:#ff8c1a;--accent2:#c247ff;--ok:#49d17d;--danger:#ff5c7a;--line:#3a2a55}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#3b1d5e 0%,var(--bg) 60%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:0 16px 48px}
.wrap{max-width:560px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:.3px}
.sub{color:var(--muted);margin:0;font-size:15px}
.pump{font-size:44px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#150c26;color:var(--text);font-size:16px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);margin:8px 0;cursor:pointer;transition:.15s}
.opt input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:#3a2152;box-shadow:0 0 0 2px rgba(255,140,26,.35)}
.opt .n{font-weight:700;font-size:16px}.opt .f{color:var(--muted);font-size:14px}
button{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--accent),#ff5c1a);color:#1a0b00;font-weight:800;font-size:17px;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;font-size:14px;padding:12px}
.msg{text-align:center;padding:32px 16px}
.msg .big{font-size:56px}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:18px;text-align:center}
.podio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin:16px 0}
.pd{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.pd .m{font-size:34px}.pd .n{font-weight:800;font-size:15px;margin-top:4px}.pd .f{font-size:12px;color:var(--muted)}.pd .v{font-size:13px;color:var(--accent);margin-top:6px;font-weight:700}
.pd.p1{order:2;padding-top:24px;border-color:#ffc83d;background:#3a2a1c}.pd.p2{order:1}.pd.p3{order:3}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}.row .f{color:var(--muted);font-size:13px}
.bar{height:6px;background:#150c26;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#150c26;color:var(--muted)}
.pill.on{background:#1f3d2a;color:var(--ok)}.pill.off{background:#4a1f2a;color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 button{margin-top:0}
.small{font-size:12px;color:var(--muted)}
.del{background:none;border:0;color:var(--danger);font-size:12px;width:auto;padding:4px 8px;margin:0;font-weight:600}
</style></head><body><div class="wrap">
<header><div class="pump">🎃</div><h1>Melhor Fantasia</h1><p class="sub">Halloween Grupo Shrigma · vote na sua favorita</p></header>
<div id="app"><div class="card"><div class="msg small">Carregando…</div></div></div>
<div id="form" style="display:none">
  <div class="card"><label for="nome">Seu nome</label><input type="text" id="nome" placeholder="Como você se chama?" maxlength="60" autocomplete="name"></div>
  <div class="card"><label>Escolha uma fantasia</label><div id="opts"></div></div>
  <button id="btn">Confirmar meu voto</button>
  <div class="err" id="err"></div>
  <p class="small" style="text-align:center">Cada pessoa vota uma única vez. O resultado será divulgado no final da festa.</p>
</div>
</div>
<script>
const API='https://evkqgwlukhdorlpkrlaj.supabase.co/functions/v1/fantasias';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok=null;try{tok=localStorage.getItem('fant_tok');if(!tok){tok=crypto.randomUUID();localStorage.setItem('fant_tok',tok)}}catch(e){tok=crypto.randomUUID()}
let cands=[];
function podio(p){if(!p||!p.length)return'';const cls=['p1','p2','p3'],med=['🥇','🥈','🥉'];return'<div class="podio">'+p.slice(0,3).map((c,i)=>'<div class="pd '+cls[i]+'"><div class="m">'+med[i]+'</div><div class="n">'+esc(c.pessoa)+'</div><div class="f">'+esc(c.fantasia)+'</div><div class="v">'+c.votos+' voto'+(c.votos==1?'':'s')+'</div></div>').join('')+'</div>'}
function show(h){$('#app').innerHTML=h;$('#form').style.display='none'}
async function load(){
  let s;try{const r=await fetch(API+'/estado?token='+encodeURIComponent(tok));s=await r.json()}catch(e){show('<div class="card"><div class="msg"><div class="big">📡</div><h2>Sem conexão</h2><p class="sub">Tente abrir de novo em instantes.</p></div></div>');return}
  cands=s.candidatos||[];
  if(s.encerrada){
    if(s.revelar&&s.podio){show('<div class="card"><div class="msg" style="padding:12px 0 0"><div class="big">🏆</div><h2 style="margin:4px 0">Resultado final</h2><p class="sub">As fantasias mais votadas da noite</p></div>'+podio(s.podio)+'</div>')}
    else show('<div class="card"><div class="msg"><div class="big">🔒</div><h2>Votação encerrada</h2><p class="sub">O resultado será anunciado em breve!</p></div></div>');
    return;
  }
  if(s.jaVotou){const c=cands.find(x=>x.id==s.voto);show('<div class="card"><div class="msg"><div class="big">✅</div><h2>Voto registrado!</h2><p class="sub">Você votou em <b>'+(c?esc(c.pessoa)+' – '+esc(c.fantasia):'')+'</b>.<br>Obrigado por participar 👻</p></div></div>');return}
  $('#opts').innerHTML=cands.map(c=>'<label class="opt"><input type="radio" name="c" value="'+esc(c.id)+'"><div><div class="n">'+esc(c.pessoa)+'</div><div class="f">'+esc(c.fantasia)+'</div></div></label>').join('');
  $('#app').innerHTML='';$('#form').style.display='block';
}
$('#btn').onclick=async()=>{
  const nome=$('#nome').value.trim();const sel=document.querySelector('input[name=c]:checked');$('#err').textContent='';
  if(!nome)return $('#err').textContent='Digite seu nome para votar.';
  if(!sel)return $('#err').textContent='Escolha uma fantasia.';
  $('#btn').disabled=true;
  try{
    const r=await fetch(API+'/votar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({votante:nome,device_token:tok,candidato_id:sel.value})});
    const d=await r.json();
    if(!r.ok){$('#err').textContent=d.erro||'Não foi possível registrar o voto.';$('#btn').disabled=false;if(d.jaVotou)load();return}
  }catch(e){$('#err').textContent='Falha de conexão. Tente de novo.';$('#btn').disabled=false;return}
  load();
};
load();
</script></body></html>
